# iOS build for the App Store, run on Codemagic's Macs (no Mac needed locally).
# Needs one App Store Connect API key added in Codemagic under
# Team settings > Integrations > Developer Portal, named "moonhush_asc".
workflows:
  ios-release:
    name: iOS release
    max_build_duration: 60
    integrations:
      app_store_connect: moonhush_asc
    environment:
      flutter: 3.27.1
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.moonhush.app
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
