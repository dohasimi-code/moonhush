plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.moonhush.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.moonhush.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24 // audio_session needs Android 7.0+
        targetSdk = 36 // Google Play requires a recent target for new apps
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // The upload key comes from CI secrets; without them (local builds) the
    // release build falls back to the debug key.
    def keystorePath = System.getenv("MOONHUSH_KEYSTORE_PATH")

    signingConfigs {
        if (keystorePath) {
            upload {
                storeFile = file(keystorePath)
                storePassword = System.getenv("MOONHUSH_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("MOONHUSH_KEY_ALIAS")
                keyPassword = System.getenv("MOONHUSH_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePath ? signingConfigs.upload : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
