name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.MOONHUSH_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: flutter build apk --release
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # surface the failure as an annotation, readable without log access
            msg=$( (grep -E "^e: |error:|Error:" build.log | head -15; grep -A 25 "What went wrong" build.log | head -60) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=APK build failed::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: moonhush-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # The Play Store bundle, signed with the upload key from the repo secrets.
      # Skipped until the secrets MOONHUSH_KEYSTORE_BASE64, MOONHUSH_KEYSTORE_PASSWORD
      # and MOONHUSH_KEY_ALIAS are set.
      - name: flutter build appbundle --release
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          MOONHUSH_KEYSTORE_PASSWORD: ${{ secrets.MOONHUSH_KEYSTORE_PASSWORD }}
          MOONHUSH_KEY_ALIAS: ${{ secrets.MOONHUSH_KEY_ALIAS }}
        shell: bash
        run: |
          echo "${{ secrets.MOONHUSH_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export MOONHUSH_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('build/app/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: moonhush-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
