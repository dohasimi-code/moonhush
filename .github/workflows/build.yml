name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: flutter build apk --release
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # surface the failure as an annotation, readable without log access
            msg=$(grep -E "error|Error|FAILURE|What went wrong|wrong:|Caused by|requires|> " build.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=APK build failed::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: moonhush-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
